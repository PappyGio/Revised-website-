<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="LapuGo Travel &amp; Tours — Lakaw Ta, Go Beyond!" name="description"/>
  <title>
   Cebu Destinations | LapuGo Travel &amp; Tours
  </title>
  <link href="assets/css/style.css" rel="stylesheet"/>
 </head>
 <body data-page="destinations">
  <header id="site-header">
  </header>
  <main>
   <section class="page-hero">
    <div class="container">
     <span class="eyebrow">
      Destination discovery
     </span>
     <h1>
      Find your next Cebu stop.
     </h1>
     <p>
      Explore the places featured in LapuGo’s itineraries, from marine sanctuaries and waterfalls to island adventures.
     </p>
    </div>
   </section>
   <section>
    <div class="container">
     <div class="field" style="max-width:620px;margin-bottom:20px">
      <label>
       SEARCH DESTINATIONS
      </label>
      <input id="destination-search" placeholder="Search Oslob, Moalboal, islands…"/>
     </div>
     <div class="filter-row">
      <button class="filter-btn active" data-filter="all">
       All
      </button>
      <button class="filter-btn" data-filter="marine">
       Marine
      </button>
      <button class="filter-btn" data-filter="island">
       Island
      </button>
      <button class="filter-btn" data-filter="nature">
       Nature
      </button>
     </div>
     <div class="grid grid-3" id="destination-grid">
     </div>
    </div>
   </section>
  </main>
  <footer id="site-footer">
  </footer>
  <div class="toast">
  </div>
  <script src="assets/js/app.js">
  </script>
 </body>
</html>
